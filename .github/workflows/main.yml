name: CHEF APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Chef-App entpacken
        run: |
          rm -rf chefbuild
          mkdir -p chefbuild
          unzip -q Karsak-Stundenzettel-CHEF-FX30-SUPABASE.zip -d chefbuild
          echo "=== Inhalt ==="
          find chefbuild -maxdepth 3 -type f | head -100

      - name: APK bauen
        run: |
          cd chefbuild
          PROJECT_DIR="$(find . -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs dirname)"
          echo "Projektordner: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Stundenzettel-CHEF
          path: chefbuild/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
