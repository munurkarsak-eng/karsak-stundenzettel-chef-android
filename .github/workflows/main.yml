name: CHEF FX39 APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: CHEF FX32 entpacken
        run: |
          rm -rf chef32build
          mkdir -p chef32build
          unzip -o "Karsak-Stundenzettel-CHEF-FX32-SUPABASE-KALENDER-FIX.zip" -d chef32build

      - name: CHEF FX32 APK bauen
        run: |
          cd chef32build
          PROJECT_DIR="$(find . -name settings.gradle.kts -printf '%h\n' | head -1)"
          echo "Projektordner: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Stundenzettel-CHEF-FX32
          path: chef32build/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
